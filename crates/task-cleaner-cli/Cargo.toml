[package]
name = "task-cleaner-cli"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Native CLI tool for Task Cleaner (mtc) on Windows"

[[bin]]
name = "mtc"
path = "src/main.rs"

[dependencies]
task-cleaner-core = { path = "../task-cleaner-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
